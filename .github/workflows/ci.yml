name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          # The SDK global.json pins, plus the .NET 10 runtime the net10.0 tests run on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      # Each package must carry the README and icon nuget.org shows.
      - name: Package contents
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "$package"
            unzip -l "$package" > contents.txt
            grep -qE " README\.md$" contents.txt
            grep -qE " icon\.png$" contents.txt
            unzip -p "$package" '*.nuspec' > package.nuspec
            grep -q "<readme>README.md</readme>" package.nuspec
            grep -q "<icon>icon.png</icon>" package.nuspec
          done
          test "$(ls ./artifacts/*.nupkg | wc -l)" -eq 1
          # The target that lets Microsoft.AspNetCore.OpenApi's interceptors compile in an app
          # referencing only this package.
          unzip -l ./artifacts/Hlibz.OpenApi.AspNetCore.[0-9]*.nupkg > contents.txt
          grep -qE " buildTransitive/Hlibz\.OpenApi\.AspNetCore\.targets$" contents.txt

      # An app referencing only the packed package compiles and describes a referenced project's
      # type, from a plain build and as a single file.
      - name: Packed package
        run: .github/scripts/check-packed-package.sh ./artifacts
